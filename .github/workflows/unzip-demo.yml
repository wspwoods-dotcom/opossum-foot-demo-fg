name: Extract demo zip
on:
  push:
    paths:
      - 'possum-foot-demo-fg.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract demo site to repo root
        run: |
          set -e
          test -f possum-foot-demo-fg.zip
          unzip -o possum-foot-demo-fg.zip
          cp -a possum-foot-app-demo-fg-deploy/. .
          rm -rf possum-foot-app-demo-fg-deploy possum-foot-demo-fg.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract demo site files to repo root" || echo "Nothing to commit"
          git push
